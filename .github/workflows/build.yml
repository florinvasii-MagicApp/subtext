name: Build SUBTEXT Android AAB & APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Preluare fisiere SUBTEXT
        uses: actions/checkout@v4

      - name: 2. Configurare Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configurare Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Generare Proiect Nativ Android & Keystore
        run: |
          mkdir -p android-app/app/src/main/assets
          mkdir -p android-app/app/src/main/java/com/florinvasii/subtext
          mkdir -p android-app/app/src/main/res/drawable
          mkdir -p android-app/app/src/main/res/values

          cp index.html android-app/app/src/main/assets/index.html

          keytool -genkeypair -v \
            -keystore android-app/subtext-release.keystore \
            -alias subtext_key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass Subtext2026! -keypass Subtext2026! \
            -dname "CN=Florin Vasii, OU=MagicApp, O=Subtext, L=Bucharest, S=IF, C=RO"

          cat << 'EOF' > android-app/KEYSTORE-INFO.txt
          ====================================================
          INFORMATII CHEIE SEMNATURA GOOGLE PLAY (PASTReAZA!)
          ====================================================
          Fisier Keystore : subtext-release.keystore
          Key Alias       : subtext_key
          Store Password  : Subtext2026!
          Key Password    : Subtext2026!
          Package ID      : com.florinvasii.subtext
          ====================================================
          EOF

          cat << 'EOF' > android-app/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SUBTEXT"
          include(":app")
          EOF

          cat << 'EOF' > android-app/build.gradle
          plugins {
              id 'com.android.application' version '8.3.2' apply false
          }
          EOF

          cat << 'EOF' > android-app/gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > android-app/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.florinvasii.subtext'
              compileSdk 35

              defaultConfig {
                  applicationId "com.florinvasii.subtext"
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName "1.0.0"
              }

              signingConfigs {
                  release {
                      storeFile file("../subtext-release.keystore")
                      storePassword "Subtext2026!"
                      keyAlias "subtext_key"
                      keyPassword "Subtext2026!"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          dependencies {}
          EOF

          cat << 'EOF' > android-app/app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="512"
              android:viewportHeight="512">
              <path
                  android:fillColor="#08090E"
                  android:pathData="M0,0h512v512h-512z"/>
              <path
                  android:fillColor="#F59E0B"
                  android:pathData="M96,64L416,64A32,32 0,0 1,448 96L448,416A32,32 0,0 1,416 448L96,448A32,32 0,0 1,64 416L64,96A32,32 0,0 1,96 64z"/>
              <path
                  android:fillColor="#08090E"
                  android:pathData="M190,195 C190,155 322,155 322,205 C322,245 190,250 190,305 C190,355 322,355 322,305"
                  android:strokeWidth="44"
                  android:strokeColor="#08090E"
                  android:strokeLineCap="round"/>
          </vector>
          EOF

          cat << 'EOF' > android-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="SUBTEXT"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android-app/app/src/main/java/com/florinvasii/subtext/MainActivity.java
          package com.florinvasii.subtext;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Window;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_RESULT_CODE = 1001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Window window = getWindow();
                  window.setStatusBarColor(Color.parseColor("#08090E"));
                  window.setNavigationBarColor(Color.parseColor("#08090E"));

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.parseColor("#08090E"));
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                          if (MainActivity.this.filePathCallback != null) {
                              MainActivity.this.filePathCallback.onReceiveValue(null);
                          }
                          MainActivity.this.filePathCallback = filePathCallback;
                          Intent intent = fileChooserParams.createIntent();
                          try {
                              startActivityForResult(intent, FILE_CHOOSER_RESULT_CODE);
                          } catch (Exception e) {
                              MainActivity.this.filePathCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILE_CHOOSER_RESULT_CODE) {
                      if (filePathCallback == null) return;
                      Uri[] results = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  } else {
                      super.onActivityResult(requestCode, resultCode, data);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: 5. Compilare SUBTEXT (.aab pentru Google Play si .apk pentru telefon)
        working-directory: android-app
        run: |
          gradle bundleRelease assembleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab ./SUBTEXT-GooglePlay.aab
          cp app/build/outputs/apk/release/app-release.apk ./SUBTEXT-Telefon.apk

      - name: 6. Publicare directa in sectiunea Releases pe GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "SUBTEXT Android v1.0.${{ github.run_number }} (AAB & APK)"
          body: "Pachet complet generat automat pentru Google Play Console (.aab), telefon (.apk) si cheia de semnatura (.keystore)."
          files: |
            android-app/SUBTEXT-GooglePlay.aab
            android-app/SUBTEXT-Telefon.apk
            android-app/subtext-release.keystore
            android-app/KEYSTORE-INFO.txt
