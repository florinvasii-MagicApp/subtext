name: Build SUBTEXT Android AAB & APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Preluare fisiere SUBTEXT
        uses: actions/checkout@v4

      - name: 2. Configurare Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configurare Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 4. Generare Proiect Android si Keystore
        run: |
          echo "" | tr -d ' \n\r' | base64 -d > generate_project.py
          python3 generate_project.py
          keytool -genkeypair -v -keystore android-app/subtext-release.keystore -alias subtext_key -keyalg RSA -keysize 2048 -validity 10000 -storepass Subtext2026Key -keypass Subtext2026Key -dname "CN=Florin Vasii, OU=MagicApp, O=Subtext, L=Bucharest, S=IF, C=RO"

      - name: 5. Compilare SUBTEXT (.aab si .apk)
        working-directory: android-app
        run: |
          gradle bundleRelease assembleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab ./SUBTEXT-GooglePlay.aab
          cp app/build/outputs/apk/release/app-release.apk ./SUBTEXT-Telefon.apk

      - name: 6. Atasare fisiere direct in pagina Actions (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Pachet-SUBTEXT-Android
          path: |
            android-app/SUBTEXT-GooglePlay.aab
            android-app/SUBTEXT-Telefon.apk
            android-app/subtext-release.keystore
            android-app/KEYSTORE-INFO.txt

      - name: 7. Publicare in sectiunea Releases pe GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "SUBTEXT Android v1.0.${{ github.run_number }} (AAB & APK)"
          body: "Pachet complet generat automat pentru Google Play Console (.aab), telefon (.apk) si cheia de semnatura (.keystore)."
          files: |
            android-app/SUBTEXT-GooglePlay.aab
            android-app/SUBTEXT-Telefon.apk
            android-app/subtext-release.keystore
            android-app/KEYSTORE-INFO.txt
